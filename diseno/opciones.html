<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Chavos — Opciones de estilo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Onest:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&family=Unbounded:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Red+Hat+Display:wght@500;600;700;800&family=Red+Hat+Text:wght@400;500;600;700&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{background:#D3D6D1}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.wrap{padding:24px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* ================= BOARD ================= */
.board{width:1400px;height:1000px;border-radius:30px;overflow:hidden;position:relative;background:var(--board);color:var(--ink);
  font-family:var(--ui);padding:40px 44px}
.board>*{position:relative}
.fx{position:absolute!important;inset:0;pointer-events:none}
.grain::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:var(--grainO,.09);mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}

.bh{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:26px}
.chips{display:flex;gap:8px}
.tag{height:28px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
  background:var(--surface);border:1px solid var(--line);color:var(--ink2)}
.tag b{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.bname{font-family:var(--disp);font-weight:var(--dispW);letter-spacing:var(--dispTrack);font-size:56px;line-height:1;margin:16px 0 12px}
.bdesc{font-size:15px;color:var(--ink2);max-width:640px;line-height:1.55}
.fonts{display:flex;flex-direction:column;gap:10px;min-width:300px}
.fp{display:flex;align-items:baseline;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:9px}
.fl{font-size:12px;font-weight:600;color:var(--ink3)}
.fv{font-size:19px;font-weight:600;color:var(--ink)}

.grid{display:grid;grid-template-columns:1fr 1fr 316px;gap:32px;align-items:start}
.panel{display:flex;flex-direction:column}
.h{font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:7px;margin-bottom:13px;color:var(--ink)}
.h::after{content:'';width:24px;height:3px;border-radius:2px;background:var(--accent)}
.sws{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.sw{height:78px;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-end;font-size:10.5px;line-height:1.3}
.sw .hx{font-weight:700;font-variant-numeric:tabular-nums}
.sw .nm{font-weight:600;opacity:.92}
.sw .rl{opacity:.7}
.stamps{display:flex;gap:12px}
.stampcol{display:flex;flex-direction:column;align-items:center;gap:6px;width:62px}
.stampcol .sl{font-size:10.5px;font-weight:600;color:var(--ink2);text-align:center}
.stampcol .sh{font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums}
.valid{margin-top:14px;display:flex;align-items:flex-start;gap:8px;font-size:12px;line-height:1.5;color:var(--ink2)}
.valid svg{color:var(--pos);margin-top:1px}
.icons{display:flex;flex-wrap:wrap;gap:13px;color:var(--ink2)}

.spec{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px}
.specrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.specrow span:first-child{font-size:12px;font-weight:600;color:var(--ink3)}
.specrow span:last-child{font-size:11.5px;color:var(--ink3)}
.dispbig{font-family:var(--heroNum);font-weight:var(--dispW);letter-spacing:var(--dispTrack);font-size:44px;line-height:1.05}
.dispmed{font-family:var(--disp);font-weight:var(--dispW);letter-spacing:var(--dispTrack);font-size:25px;line-height:1.15;margin-top:6px}
.uit{font-size:19px;font-weight:700;letter-spacing:-.01em}
.uib{font-size:14px;color:var(--ink2);line-height:1.5;margin-top:4px}
.uil{font-size:12px;font-weight:600;color:var(--ink3);margin-top:8px}
.princ{display:flex;flex-direction:column;gap:9px}
.princ div{display:flex;gap:10px;font-size:13px;line-height:1.5;color:var(--ink2)}
.princ i{font-style:normal;font-family:var(--ui);font-weight:700;color:var(--accent);font-size:13px;min-width:14px}

/* shared controls */
.btns{display:flex;gap:9px}
.btn{height:44px;flex:1;border-radius:var(--rBtn);display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:600}
.b-pri{background:var(--primaryBg);color:var(--onPrimary);box-shadow:var(--btnShadow,none)}
.b-sec{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.b-neg{background:color-mix(in oklab,var(--neg) 16%,var(--surfaceSolid));color:var(--neg)}
.crow{display:flex;gap:7px;align-items:center;margin-top:11px}
.chip{height:32px;padding:0 13px;border-radius:var(--rChip,999px);display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;
  background:var(--surface);border:1px solid var(--line);color:var(--ink2)}
.chip.on{background:var(--primaryBg);border-color:transparent;color:var(--onPrimary)}
.tg{width:44px;height:26px;border-radius:999px;background:var(--tgOff);position:relative;flex:0 0 auto}
.tg::after{content:'';position:absolute;width:20px;height:20px;top:3px;left:3px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tg.on{background:var(--primarySolid)}.tg.on::after{left:21px}
.fields{display:flex;gap:14px;margin-top:13px}
.fld{flex:1}
.fld .fl2{font-size:12px;font-weight:600;color:var(--ink3);margin-bottom:7px}
.fbox{font-size:14.5px;display:flex;align-items:center;min-height:22px}
.f-underline .fbox{border-bottom:1.5px solid var(--line);padding-bottom:9px}
.f-underline .on .fbox{border-bottom-color:var(--primarySolid)}
.f-outline .fbox{border:1.5px solid var(--line);border-radius:var(--rBtn);padding:11px 12px}
.f-outline .on .fbox{border-color:var(--primarySolid)}
.f-filled .fbox{background:var(--surface2);border-radius:12px;padding:12px}
.f-filled .on .fbox{box-shadow:inset 0 0 0 1.5px var(--primarySolid)}
.f-glass .fbox{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.f-glass .on .fbox{border-color:var(--accent)}
.ph-t{color:var(--ink3)}

/* stamps */
.stamp{width:40px;height:40px;border-radius:var(--rStamp);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.stamp.big{width:48px;height:48px}
.s-tint{background:color-mix(in oklab,var(--c) 15%,var(--surfaceSolid));color:var(--c)}
.s-tintDark{background:color-mix(in oklab,var(--c) 24%,var(--surfaceSolid));color:color-mix(in oklab,var(--c) 55%,#fff)}
.s-solid{background:var(--c);color:#fff}
.s-mono{background:var(--surface2);color:var(--ink2)}
.cpal{display:flex;gap:9px}
.cpal div{flex:1;display:flex;flex-direction:column;gap:5px}
.cpal i{height:28px;border-radius:6px;display:block}
.cpal span{font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.t-grafitoclaro .hero{background:#26272B}
.t-monocromo .hero{background:#000}
.t-monocromo .num{font-variant-numeric:normal;font-feature-settings:normal}
.t-arena .hero{background:#4F5A3A}
.t-acero .hero{background:#222932;border:1px solid #313A45;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.s-glow{background:color-mix(in oklab,var(--c) 22%,transparent);color:color-mix(in oklab,var(--c) 55%,#fff);
  box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--c) 60%,transparent),0 0 18px -5px var(--c)}

/* ================= PHONE ================= */
.phwrap{width:calc(390px * var(--S));height:calc(844px * var(--S));flex:0 0 auto;border-radius:calc(46px * var(--S));
  box-shadow:0 30px 60px -24px rgba(0,0,0,.45),0 0 0 1px var(--phRing,rgba(0,0,0,.08))}
.ph{width:390px;height:844px;transform:scale(var(--S));transform-origin:top left;border-radius:46px;overflow:hidden;position:relative;
  background:var(--bg);color:var(--ink);font-family:var(--ui);display:flex;flex-direction:column}
.ph>.fx{z-index:0}
.ph>*:not(.fx){position:relative;z-index:1}
.sb{height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-size:14px;font-weight:600}
.sbr{display:flex;align-items:center;gap:6px}
.hd{display:flex;align-items:center;gap:12px;padding:0 20px 16px}
.av{width:44px;height:44px;border-radius:var(--rAv,15px);background:var(--avBg);color:var(--avInk);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:0 0 auto}
.hd-hi{font-size:12px;font-weight:600;color:var(--ink3)}
.hd-name{font-size:16px;font-weight:700;letter-spacing:-.015em;margin-top:1px}
.ib{width:38px;height:38px;border-radius:13px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative}
.ib .dt{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--neg);border:1.5px solid var(--surfaceSolid)}
.hdL{display:flex;align-items:flex-end;justify-content:space-between;padding:4px 20px 14px}
.hdL-date{font-size:13px;font-weight:600;color:var(--ink3);letter-spacing:-.005em}
.hdL-title{font-family:var(--disp);font-size:34px;font-weight:var(--dispW);letter-spacing:var(--dispTrack);line-height:1.05;margin-top:2px}
.hdL .r{display:flex;gap:10px;align-items:center}
.plusc{width:36px;height:36px;border-radius:50%;background:var(--plusBg);color:var(--plusInk);display:flex;align-items:center;justify-content:center}
.scroll{flex:1 1 auto;overflow:hidden;display:flex;flex-direction:column;gap:11px;padding:0 20px 6px}
.scroll>*{flex:0 0 auto}

.hero{border-radius:var(--rHero);padding:16px 20px 14px;position:relative;overflow:hidden;color:var(--heroInk)}
.hero>*{position:relative}
.hero-top{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:var(--heroInk2)}
.pill{height:24px;padding:0 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  background:var(--pillBg);color:var(--heroInk);border:1px solid var(--pillLine)}
.hero-amt{font-family:var(--heroNum);font-weight:var(--heroW,var(--dispW));letter-spacing:var(--heroTrack,var(--dispTrack));font-size:var(--heroSize,37px);line-height:1;margin-top:8px}
.hero-rule{height:1px;margin:15px 0 12px;background:var(--heroRule)}
.hero-split{display:flex}
.hero-split>div{flex:1}
.hl{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--heroInk2)}
.hv{font-size:15px;font-weight:600;margin-top:3px;font-family:var(--num)}
.vsep{flex:0 0 1px!important;background:var(--heroRule);margin:0 14px}
.glow{position:absolute!important;width:220px;height:220px;right:-70px;top:-90px;border-radius:50%;background:radial-gradient(circle,var(--glow) 0%,transparent 70%)}

.qa{display:flex;gap:9px}
.qa>div{flex:1;background:var(--surface);border:1px solid var(--cardLine);border-radius:calc(var(--rCard) - 4px);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;box-shadow:var(--cardShadow)}
.card{background:var(--surface);border:1px solid var(--cardLine);border-radius:var(--rCard);box-shadow:var(--cardShadow)}
.chead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;min-height:27px}
.ctitle{font-size:15px;font-weight:700;letter-spacing:-.005em;display:flex;flex-direction:column;gap:6px}
.ctitle::after{content:'';width:24px;height:3px;border-radius:2px;background:var(--accent);display:var(--ruleDisp,block)}
.cap{font-size:11.5px;color:var(--ink3)}
.bars{display:flex;align-items:flex-end;gap:11px;height:76px;position:relative}
.bar{flex:1;border-radius:4px 4px 0 0;background:var(--chartBar)}
.bar.now{background:var(--chartNow)}
.avg{position:absolute;left:0;right:0;bottom:62px;border-top:1.5px dashed var(--avgLine)}
.xl{display:flex;gap:11px;margin-top:7px}
.xl span{flex:1;text-align:center;font-size:10.5px;color:var(--ink3);font-weight:500}
.xl span:last-child{color:var(--ink);font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:9px 0}
.row+.row{border-top:1px solid var(--rowLine)}
.row .g{flex:1;min-width:0}
.tt{font-size:14.5px;font-weight:600;letter-spacing:-.006em}
.ss{font-size:11.5px;color:var(--ink3);margin-top:1px}
.amt{font-size:14.5px;font-weight:600;font-family:var(--num);letter-spacing:-.01em}
.sect{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700;margin-top:2px}
.lnk{font-size:12.5px;font-weight:600;color:var(--link)}

/* nav variants */
.nav{flex:0 0 78px;display:flex;align-items:flex-start;padding:11px 12px 0;background:var(--navBg);border-top:1px solid var(--navLine);backdrop-filter:blur(16px) saturate(160%)}
.nav .it{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--navOff);font-size:10.5px;font-weight:600}
.nav .it.on{color:var(--navOn)}
.nav .dot{width:4px;height:4px;border-radius:50%;background:var(--navOn)}
.nfab{flex:0 0 62px;display:flex;justify-content:center}
.nfab>div{width:52px;height:52px;border-radius:var(--rFab,18px);background:var(--primaryBg);color:var(--onPrimary);display:flex;align-items:center;justify-content:center;margin-top:-18px;box-shadow:var(--fabShadow)}
.navfloat{position:absolute!important;left:18px;right:18px;bottom:24px;display:flex;gap:10px;z-index:3}
.navfloat .cap2{flex:1;height:62px;border-radius:31px;display:flex;align-items:center;padding:0 8px;background:var(--navBg);border:1px solid var(--navLine);
  backdrop-filter:blur(26px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 14px 30px -12px rgba(0,0,0,.5)}
.navfloat .it{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--navOff);font-size:10px;font-weight:600;padding:6px 0;border-radius:24px}
.navfloat .it.on{color:var(--navOn);background:var(--navOnBg)}
.navfloat .fb{width:62px;height:62px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--onPrimary);
  background:var(--floatFab);border:1px solid var(--navLine);backdrop-filter:blur(26px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 14px 30px -12px rgba(0,0,0,.5)}
.homebar{position:absolute!important;left:50%;transform:translateX(-50%);bottom:8px;width:134px;height:5px;border-radius:3px;background:var(--homebar);z-index:4!important}

/* ================= THEME SPECIFICS ================= */
/* 0 actual */
.t-actual .hero{background:linear-gradient(158deg,#164A3C 0%,#0C2B23 72%)}
/* 1 pizarra — matte */
.t-pizarra .hero{background:#3B4C63}
/* 2 grafito — matte dark */
.t-grafito .hero{background:#2B2C30;border:1px solid #37393E}
/* 3 aurora */
.t-aurora .fx.aur, .t-aurora .ph>.fx{background:
  radial-gradient(ellipse 60% 40% at 15% 8%,rgba(106,77,255,.55),transparent 70%),
  radial-gradient(ellipse 50% 35% at 90% 30%,rgba(0,194,184,.35),transparent 70%),
  radial-gradient(ellipse 60% 40% at 60% 105%,rgba(214,51,132,.35),transparent 70%)}
.t-aurora .hero{background:linear-gradient(140deg,rgba(106,77,255,.42),rgba(10,13,31,.25) 55%,rgba(47,224,200,.26));
  border:1px solid rgba(255,255,255,.18);box-shadow:0 0 44px -14px rgba(106,77,255,.9),inset 0 1px 0 rgba(255,255,255,.2);backdrop-filter:blur(18px)}
.t-aurora .card,.t-aurora .qa>div,.t-aurora .ib{backdrop-filter:blur(18px)}
.t-aurora .panel,.t-glass .panel{background:var(--panelBg);border:1px solid var(--line);border-radius:22px;padding:20px 20px 22px;backdrop-filter:blur(20px)}
/* 4 cromo */
.t-cromo .fx.dots,.t-cromo .ph>.fx{background-image:radial-gradient(#C3C9D4 1px,transparent 1.3px);background-size:16px 16px;opacity:.7}
.t-cromo .hero{background:linear-gradient(125deg,#FBFCFE 0%,#D2D7E0 24%,#F7F8FB 42%,#B4BBC9 66%,#E8EBF0 100%);border:1px solid #BFC6D2;
  box-shadow:inset 0 1px 0 #fff,0 10px 24px -14px rgba(13,16,32,.45)}
.t-cromo .hero::before{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.85) 47%,transparent 56%)}
.t-cromo .hero-amt{color:var(--ink)}
.t-cromo .hero .led{position:absolute!important;top:16px;right:20px;display:flex;align-items:center;gap:6px;font-family:var(--num);font-size:10.5px;color:#4A516B}
/* 5 wallet */
.t-wallet .hero{background:
  radial-gradient(circle at 10% 15%,#FFB347 0%,transparent 45%),
  radial-gradient(circle at 92% 8%,#FF5E9C 0%,transparent 50%),
  radial-gradient(circle at 78% 100%,#6C63FF 0%,transparent 55%),
  radial-gradient(circle at 6% 100%,#2EC5FF 0%,transparent 52%),#9A5CF0;box-shadow:0 16px 30px -16px rgba(120,70,220,.7)}
/* 6 glass */
.t-glass .fx.wall,.t-glass .ph>.fx{background:
  radial-gradient(circle at 14% 10%,#3D5BFF 0%,transparent 40%),
  radial-gradient(circle at 90% 28%,#C548A8 0%,transparent 42%),
  radial-gradient(circle at 26% 88%,#FF8A3D 0%,transparent 40%),
  linear-gradient(165deg,#0B1B4D 0%,#2E1A66 55%,#5E2458 100%)}
.t-glass .ph>.fx{background:
  radial-gradient(circle at 90% 12%,#FF8A3D 0%,transparent 32%),
  radial-gradient(circle at 8% 28%,#3D5BFF 0%,transparent 42%),
  radial-gradient(circle at 84% 56%,#C548A8 0%,transparent 38%),
  linear-gradient(172deg,#1A2A78 0%,#2E1A66 52%,#17123F 100%)}
.t-glass .ph .card{background:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.07)),rgba(20,18,64,.30)}
.t-glass .hero,.t-glass .card,.t-glass .qa>div,.t-glass .ib{backdrop-filter:blur(26px) saturate(170%)}
.t-glass .hero{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.36);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.12),0 20px 40px -20px rgba(0,0,0,.55)}
.t-glass .card,.t-glass .qa>div{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 16px 30px -18px rgba(0,0,0,.5)}

/* ================= COMPARISON ================= */
.cmp{width:2144px;border-radius:30px;background:#F4F5F2;padding:40px 44px 46px;font-family:'Public Sans',sans-serif;color:#16211C}
.cmp-h{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:30px}
.cmp-t{font-family:'Fraunces',serif;font-size:40px;font-weight:600;letter-spacing:-.025em}
.cmp-row{display:flex;gap:24px}
.cmp-col{display:flex;flex-direction:column;gap:14px}
.cmp-lab .a{font-size:12px;font-weight:600;color:#7E8C84}
.cmp-lab .b{font-size:22px;font-weight:700;letter-spacing:-.015em;margin-top:3px}
.cmp-lab .c{font-size:12.5px;color:#4A574F;margin-top:3px}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>

function vars(t,S){
  const v={...t.v, disp:t.disp, ui:t.ui, num:t.num||t.ui, heroNum:t.heroNum||t.disp, dispW:t.dispW, dispTrack:t.dispTrack, S};
  return Object.entries(v).map(([k,x])=>`--${k}:${x}`).join(';');
}

function board(t){
  const sws=t.sw.map(([bg,nm,rl])=>{
    const light = /^#/.test(bg) ? lum(bg)>.35 : false;
    const ink = light ? '#15181D' : '#FFFFFF';
    const bd = (bg===t.v.board||bg===t.v.surface||/rgba/.test(bg)) ? `border:1px solid ${t.v.line};` : '';
    const hex = /rgba/.test(bg) ? 'rgba 255 · 14 %' : bg;
    return `<div class="sw" style="background:${bg};color:${ink};${bd}"><div class="hx">${/rgba/.test(bg)?'Blanco 14 %':bg}</div><div class="nm">${nm}</div><div class="rl">${rl}</div></div>`;
  }).join('');
  const mono=t.stamp==='mono';
  const stamps=t.cats.map(([c,ic])=>`<div class="stampcol">${stamp(t,c,ic,true)}<span class="sl">${CAT[ic]}</span>${mono?'':`<span class="sh">${c}</span>`}</div>`).join('');

  const fieldCls={pizarra:'f-outline',grafito:'f-filled',aurora:'f-glass',cromo:'f-outline',wallet:'f-filled',glass:'f-glass',

        ${t.numName?`<div class="fp"><span class="fl">Cifras</span><span class="fv" style="font-family:${t.num}">${t.numName}</span></div>`:''}

        ${cpal}

        <div class="h" style="margin-top:22px">Íconos</div><div class="icons">${icons}</div>
      </div>
      <div class="panel">
        <div class="h">Tipografía</div>
        <div class="spec"><div class="specrow"><span>${t.numName?t.numName:t.dispName}</span><span>Cifras</span></div>
          <div class="dispbig num">$1.250.000</div>

function compare(ids,title,sub){
  const list=ids.map(id=>T.find(t=>t.id===id));
  const cols=list.map(t=>`<div class="cmp-col">
      <div class="cmp-lab"><div class="a">${t.n===0?'Diseño actual':'Opción '+t.n+', '+t.cat.charAt(0).toLowerCase()+t.cat.slice(1)}</div><div class="b">${t.name}</div>
        <div class="c">${t.dispName}${t.uiName!==t.dispName&&!t.dispName.startsWith(t.uiName)?' + '+t.uiName:''}</div></div>
      <div class="t-${t.id}" style="${vars(t,.7)}">${phone(t)}</div></div>`).join('');
  const w=list.length*273+(list.length-1)*24+88;
  return `<div class="cmp" style="width:${w}px"><div class="cmp-h"><div><div style="font-size:13px;font-weight:600;color:#7E8C84;margin-bottom:6px">Chavos, entrega 3</div>
      <div class="cmp-t">${title}</div></div>
      <div style="font-size:13px;color:#4A574F;text-align:right;line-height:1.6">${sub}</div></div>
    <div class="cmp-row">${cols}</div></div>`;
}

const q=new URLSearchParams(location.search).get('o');
const ph=new URLSearchParams(location.search).get('p');
const root=document.getElementById('root');
if(ph){ const t=T.find(x=>x.id===ph); const tr=new URLSearchParams(location.search).get('t');
  root.style.padding=tr?'44px':'20px'; document.body.style.background=tr?'transparent':'#E4E4E2';
  if(tr) document.head.insertAdjacentHTML('beforeend','<style>.phwrap{box-shadow:0 18px 36px -18px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.08)!important}</style>');
  root.innerHTML=`<div class="t-${t.id}" style="${vars(t,1)}">${phone(t)}</div>`; }
else if(q==='cmp') root.innerHTML=compare(['actual','pizarra','grafito','aurora','cromo','wallet','glass'],'Seis direcciones de estilo, lado a lado','Misma pantalla, mismos datos.<br>Cambian color, tipografía, materiales y forma.');
else if(q==='cmp2') root.innerHTML=compare(['grafito','grafitoclaro','monocromo','arena','acero'],'Grafito en claro y tres opciones sobrias','Misma pantalla, mismos datos.<br>Menos color, más calma.');
else { const t=T.find(x=>String(x.n)===q) || T[1]; root.innerHTML=board(t); }
</script>
